<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>生成控制台</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, sans-serif; background: #f5f5f5; padding: 16px; max-width: 600px; margin: 0 auto; }
h1 { font-size: 18px; margin: 16px 0; }
.card { background: #fff; border-radius: 12px; padding: 16px; margin-bottom: 12px; }
.progress { height: 8px; background: #eee; border-radius: 4px; overflow: hidden; margin: 12px 0; }
.progress-bar { height: 100%; background: #2563eb; transition: width 0.3s; }
.stats { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 12px 0; }
.stat { background: #f9f9f9; padding: 10px; border-radius: 8px; text-align: center; }
.stat .label { font-size: 12px; color: #666; }
.stat .value { font-size: 18px; font-weight: bold; margin-top: 4px; }
button { width: 100%; padding: 12px; border-radius: 8px; border: none; font-size: 16px; cursor: pointer; margin-bottom: 8px; }
.btn-primary { background: #2563eb; color: #fff; }
.btn-stop { background: #ef4444; color: #fff; }
.btn-export { background: #10b981; color: #fff; }
a { color: #2563eb; text-decoration: none; font-size: 14px; }
.err { color: #ef4444; font-size: 14px; margin-top: 8px; }
.log { font-size: 13px; padding: 6px 0; border-bottom: 1px solid #f0f0f0; font-family: monospace; }
.log.done { color: #10b981; }
.log.error { color: #ef4444; }
.fs { font-size: 13px; padding: 6px 0; border-bottom: 1px solid #f0f0f0; }
.fs strong { color: #2563eb; }
</style>
</head>
<body>
<h1 id="title">控制台</h1>
<a href="/">← 返回</a>

<div class="card">
  <div class="progress"><div class="progress-bar" id="bar" style="width:0%"></div></div>
  <div style="text-align:center;font-size:14px;color:#666" id="pct">0%</div>
  <div class="stats">
    <div class="stat"><div class="label">当前章</div><div class="value" id="cur">0</div></div>
    <div class="stat"><div class="label">总章</div><div class="value" id="total">0</div></div>
    <div class="stat"><div class="label">状态</div><div class="value" id="status">-</div></div>
    <div class="stat"><div class="label">步骤</div><div class="value" id="step">-</div></div>
  </div>
  <div class="err" id="err"></div>
  <button class="btn-primary" onclick="start()">开始/继续</button>
  <button class="btn-stop" onclick="stop()">暂停</button>
  <button class="btn-export" onclick="export()">导出 TXT</button>
  <a href="/read?name=" id="readLink">查看章节 →</a>
</div>

<div class="card">
  <h3 style="margin-bottom:8px">实时日志</h3>
  <div id="logs" style="max-height:300px;overflow-y:auto">等待开始...</div>
</div>

<div class="card">
  <h3 style="margin-bottom:8px">未回收伏笔</h3>
  <div id="fs">加载中...</div>
</div>

<script>
const params = new URLSearchParams(location.search);
const name = params.get('name');
document.getElementById('title').textContent = '控制台 - ' + name;
document.getElementById('readLink').href = '/read?name=' + encodeURIComponent(name);

let logCount = 0;

// SSE 实时日志
const es = new EventSource('/api/projects/' + encodeURIComponent(name) + '/stream');
es.onmessage = function(e) {
  const data = JSON.parse(e.data);
  if (data.done) {
    es.close();
    return;
  }
  const logs = document.getElementById('logs');
  const div = document.createElement('div');
  div.className = 'log ' + (data.type || '');
  div.textContent = (data.ts ? '[' + data.ts + '] ' : '') + (data.msg || data.error || '');
  logs.appendChild(div);
  logs.scrollTop = logs.scrollHeight;
  logCount++;
  // 同时刷新进度
  refreshProgress();
};
es.onerror = function() {
  // SSE 断开，降级为轮询
  es.close();
};

async function refreshProgress() {
  try {
    const p = await (await fetch('/api/projects/' + encodeURIComponent(name) + '/progress')).json();
    const cur = p.current_chapter || 0, total = p.total_chapters || 0;
    const pct = total ? Math.round(cur / total * 100) : 0;
    document.getElementById('bar').style.width = pct + '%';
    document.getElementById('pct').textContent = pct + '%';
    document.getElementById('cur').textContent = cur;
    document.getElementById('total').textContent = total;
    document.getElementById('status').textContent = p.status || 'idle';
    document.getElementById('step').textContent = p.current_step || '-';
    document.getElementById('err').textContent = p.last_error || '';

    const fs = await (await fetch('/api/projects/' + encodeURIComponent(name) + '/foreshadows')).json();
    document.getElementById('fs').innerHTML = fs.length
      ? fs.map(f => '<div class="fs"><strong>第' + f.plant_chapter + '章</strong> ' + f.plant_summary + '</div>').join('')
      : '<p style="color:#999;font-size:13px">暂无伏笔</p>';
  } catch(e) {}
}

async function start() {
  const total = parseInt(document.getElementById('total').textContent) || 10;
  await fetch('/api/generate/start', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({project_name: name, total_chapters: total})
  });
  location.reload();
}

async function stop() {
  await fetch('/api/generate/stop', {method: 'POST'});
}

function export() {
  window.open('/api/projects/' + encodeURIComponent(name) + '/export');
}

refreshProgress();
setInterval(refreshProgress, 5000);
</script>
</body>
</html>
